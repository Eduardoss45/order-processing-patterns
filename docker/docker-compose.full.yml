services:
  postgres:
    image: postgres:16
    container_name: order-postgres
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: order-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["queue"]

  kafka:
    image: apache/kafka:latest
    container_name: order-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@order-kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["stream"]

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/cmd/kafka-init.sh:/init.sh
    entrypoint: ["/bin/sh", "/init.sh"]
    profiles: ["stream"]

  order-service-queue:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: order-service-queue
    working_dir: /app
    command: npm run dev -w order-service-queue
    env_file:
      - ../projects/queue/apps/order-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped
    profiles: ["queue"]

  worker-service:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: worker-service
    working_dir: /app
    command: npm run dev -w worker-service
    env_file:
      - ../projects/queue/apps/worker-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped
    profiles: ["queue"]

  order-service-stream:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: order-service-stream
    working_dir: /app
    command: npm run dev -w order-service-stream
    env_file:
      - ../projects/stream/apps/order-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_started
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped
    profiles: ["stream"]

  payment-service:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: payment-service
    working_dir: /app
    command: npm run dev -w payment-service
    env_file:
      - ../projects/stream/apps/payment-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_started
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped
    profiles: ["stream"]

  inventory-service:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: inventory-service
    working_dir: /app
    command: npm run dev -w inventory-service
    env_file:
      - ../projects/stream/apps/inventory-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_started
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped
    profiles: ["stream"]

  notification-service:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: notification-service
    working_dir: /app
    command: npm run dev -w notification-service
    env_file:
      - ../projects/stream/apps/notification-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_started
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped
    profiles: ["stream"]

volumes:
  postgres_data:
  kafka_data:
  app_node_modules:
